[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphadesk"
version = "0.2.0"
description = "Open-source, self-hosted market research terminal: SEC filings, market data on your own vendor keys, and 37 read-only MCP tools for your own AI agent."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
authors = [
    { name = "Vignesh Murugan" },
]
keywords = [
    "market-data", "sec-edgar", "financial-data", "terminal", "research",
    "mcp", "model-context-protocol", "self-hosted", "finance", "stocks",
    "options", "earnings", "fastapi", "open-source-finance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Environment :: Web Environment",
]
# Keep in sync with requirements.txt — that file carries the per-dependency
# rationale. There is no LLM SDK dependency of any kind: the v1 multi-agent
# system was removed (11263ae, 2026-08-07) and the transports that replaced it
# (providers/llm.py) are plain urllib against OpenAI-compatible and Anthropic
# endpoints.
dependencies = [
    "alpaca-py>=0.14.0",            # providers/alpaca.py — a user's own Alpaca key
    "pandas>=2.0.0",                # indicator math in ingest/prices.build_series_payload
    "polygon-api-client>=1.13.0",   # ingest/news.py's article source
    "beautifulsoup4>=4.12.0",       # ingest/edgar.py's filing text extraction
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "python-multipart",
    "mcp>=1.0,<2",                     # `alphadesk.main mcp` — exposes the terminal to agents
    "pg8000>=1.30",                 # ledger/db.py — Postgres, pure-Python BSD driver
    "stripe>=12",                   # billing.py — hosted checkout and webhooks, MIT
    "cryptography>=42",             # ledger/vault.py — AES-256-GCM for readers' sealed keys
    "sentence-transformers>=3",     # alphadesk/semantic.py — news search by meaning (Apache 2.0)
    "transformers>=4.51",           # Qwen3-Embedding-0.6B needs >= 4.51 (Apache 2.0)
]

# Providers plug in here. A package declaring this group is discovered
# automatically once installed — see docs/providers.md.
[project.entry-points."alphadesk.providers"]
# example = "mypackage.providers:register_all"

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]      # httpx backs fastapi's TestClient

[project.urls]
Homepage = "https://github.com/vigneshv1cky/alphadesk-terminal"
Repository = "https://github.com/vigneshv1cky/alphadesk-terminal"
Documentation = "https://github.com/vigneshv1cky/alphadesk-terminal#readme"
"Comparison and FAQ" = "https://github.com/vigneshv1cky/alphadesk-terminal/blob/main/docs/comparison.md"
Issues = "https://github.com/vigneshv1cky/alphadesk-terminal/issues"

[tool.setuptools.packages.find]
include = ["alphadesk*"]

# The built frontend ships INSIDE the package: one process serves the API and
# the SPA, so a wheel without app/static installs a server with no interface
# (2026-09-20, caught before the first PyPI release). The deploy template and
# the agent-tool examples travel with it for the same reason — the README
# tells a new installer to copy them.
[tool.setuptools.package-data]
alphadesk = [
    "app/static/**/*",
    "deploy/env.example",
]

[tool.ruff.lint]
# The rules are named, not left to the linter's defaults: ruff 0.16 widened
# its default set (115 blind-exception findings alone on this code), so an
# unpinned CI install failed on code that passed locally on 0.15 (2026-09-19).
# These are the defaults this code was written against.
select = ["E4", "E7", "E9", "F"]
